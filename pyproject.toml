[project]
name = "react-research-agent"
version = "1.0.0"
description = "A ReAct agent that answers a question with cited sources (runs offline)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "streamlit>=1.30",
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "tavily-python>=0.3",
    "trafilatura>=1.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
